<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ad-1: #ff5f3d; --ad-2: #ff8f3d; --ad-3: #ffb03d;
    --ad-ink: #d9482b;
  }
  body.skin-bug {
    --ad-1: #0c6e34; --ad-2: #1a8f47; --ad-3: #46b96a;
    --ad-ink: #0c6e34;
  }
  html, body { margin: 0; height: 100%; background: #0e0f13; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font: 12px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #cfd4e0;
    /* 广告外层：橙色描边 + 内侧高光，模仿常见的推广弹窗 */
    border: 2px solid var(--ad-1);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    box-sizing: border-box;
  }

  /* 顶部：伪装成广告条，同时也是拖拽区 */
  #bar {
    position: relative;
    height: 44px; flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 8px;
    background: linear-gradient(90deg, var(--ad-1) 0%, var(--ad-2) 55%, var(--ad-3) 100%);
    -webkit-app-region: drag; user-select: none;
    color: #fff;
  }
  #bar .tag {
    font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 3px;
    background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.45);
    letter-spacing: .5px;
  }
  #bar .copy {
    font-size: 15px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 1px rgba(120,40,0,0.35);
  }
  #bar .grow { flex: 1; min-width: 6px; }

  button {
    -webkit-app-region: no-drag;
    background: rgba(0,0,0,0.16); border: 1px solid rgba(255,255,255,0.28);
    color: #fff; border-radius: 6px; padding: 2px 6px; font-size: 11px; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: rgba(0,0,0,0.3); }
  button.on { background: rgba(255,255,255,0.28); border-color: #fff; }
  #pct { font-size: 10px; min-width: 30px; text-align: center; opacity: .9; font-variant-numeric: tabular-nums; }

  /* 关闭"广告" —— 实际就是退出播放器 */
  #cta {
    -webkit-app-region: no-drag;
    background: #fff; color: #d9482b; border: none; border-radius: 13px;
    padding: 3px 12px; font-size: 12px; font-weight: 700; cursor: default;
    box-shadow: 0 2px 6px rgba(120,40,0,0.25); white-space: nowrap;
  }

  /* 视频底部压一条促销条，最像广告 */
  #stage { position: relative; flex: 1; min-height: 0; display: flex; }
  #promo {
    position: absolute; left: 0; right: 0; bottom: 0; height: 50px; z-index: 6;
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: linear-gradient(90deg, rgba(255,95,61,0.93), rgba(255,150,61,0.93) 60%, rgba(255,176,61,0.93));
    pointer-events: none; color: #fff;
  }
  #promo .p1 { font-size: 17px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(120,40,0,0.4); }
  #promo .p2 { font-size: 12px; opacity: .92; font-variant-numeric: tabular-nums; }
  #promo .cta2 {
    margin-left: auto; background: #fff; color: var(--ad-ink); border-radius: 15px;
    padding: 6px 16px; font-size: 13px; font-weight: 800;
    box-shadow: 0 3px 10px rgba(120,40,0,0.3);
  }

  #close {
    -webkit-app-region: no-drag;
    width: 18px; height: 18px; line-height: 16px; padding: 0; border-radius: 4px;
    background: rgba(255,255,255,0.9); color: var(--ad-ink); font-weight: 700; font-size: 12px;
    border: none; cursor: pointer;
  }
  #close:hover { background: #fff; }

  #frame { flex: 1; border: 0; width: 100%; background: #000; min-height: 0; display: block; }

  /* 底部：伪装成"咨询/报名"输入条 */
  #foot {
    height: 46px; flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 0 8px; background: #1a1d24; border-top: 1px solid rgba(255,255,255,0.08);
  }
  #msg {
    flex: 1; background: #0f1116; border: 1px solid rgba(255,255,255,0.1); color: #f0f2f7;
    border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  #msg:focus { border-color: var(--ad-2); }
  #hint { color: #6b7280; font-size: 11px; min-width: 54px; text-align: right; }
  #hint.err { color: #f2777a; }

  /* 广告法要求的小标签，顺便增加真实感 */
  #admark {
    position: absolute; right: 8px; bottom: 52px; z-index: 9; pointer-events: none;
    font-size: 10px; color: rgba(255,255,255,0.55); background: rgba(0,0,0,0.35);
    padding: 1px 5px; border-radius: 3px; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="tag" id="tag">推广</span>
    <span class="copy" id="copy">限时特惠 · 新用户专享 0 元购</span>
    <span class="grow"></span>
    <button id="dim" title="降低不透明度">透明−</button>
    <span id="pct">100%</span>
    <button id="bright" title="提高不透明度">透明+</button>
    <button id="top" title="切换始终置顶">置顶</button>
    <button id="side" title="侧栏广告：竖屏直播时填满两侧黑边">📢</button>
    <button id="listen" title="黑听：收起画面，声音继续">🎧</button>
    <button id="sound" title="切换声音">🔇</button>
    <button id="close" title="关闭">×</button>
  </div>

  <div id="stage">
    <iframe id="frame" src="http://127.0.0.1:8731/?embed=1&bare=1" allow="autoplay"></iframe>
    <div id="promo">
      <span class="p1" id="p1">限时秒杀</span>
      <span class="p2" id="p2">距结束 <b id="clock">02:31:12</b></span>
      <span class="cta2" id="cta">立即抢购</span>
    </div>
    <div id="admark">广告</div>
  </div>

  <div id="foot">
    <input id="msg" maxlength="40" placeholder="说点什么…" autocomplete="off" spellcheck="false" />
    <span id="hint"></span>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const api = window.moyuDesktop;

  const SKINS = {
    promo: {
      tag: '推广',
      copy: '限时特惠 · 新用户专享 0 元购',
      p1: '限时秒杀',
      p2: '距结束',
      cta: '立即抢购',
    },
    bug: {
      tag: '广告',
      copy: '拜耳 · 专业除蟑 · 一窝端',
      p1: '一窝端',
      p2: '药效持续',
      cta: '立即购买',
    },
  };

  let skin = 'promo';

  function applySkin(next) {
    skin = SKINS[next] ? next : 'promo';
    document.body.classList.toggle('skin-bug', skin === 'bug');
    const cfg = SKINS[skin];
    $('tag').textContent = cfg.tag;
    $('copy').textContent = cfg.copy;
    $('p1').textContent = cfg.p1;
    $('p2').childNodes[0].textContent = cfg.p2 + ' ';
    $('cta').textContent = cfg.cta;
    try {
      frameEl.contentWindow.postMessage({ type: 'moyu:skin', skin }, '*');
    } catch {}
  }

  function paint(state) {
    $('pct').textContent = Math.round(state.opacity * 100) + '%';
    $('top').classList.toggle('on', state.alwaysOnTop);
    if (state.skin && state.skin !== skin) applySkin(state.skin);
  }

  api.state().then(paint);
  api.onState(paint);

  const frameEl = $('frame');
  frameEl.addEventListener('load', () => {
    setTimeout(() => applySkin(skin), 350);
  });

  $('dim').onclick = () => api.opacity(-0.1).then(paint);
  $('bright').onclick = () => api.opacity(0.1).then(paint);
  $('top').onclick = () => api.top().then(paint);
  $('listen').onclick = () => api.listen();

  // 侧栏广告：竖屏开、横屏关，状态记在本地
  let sideOn = localStorage.getItem('moyu.sideads') === '1';
  function paintSide() {
    $('side').classList.toggle('on', sideOn);
    $('side').title = sideOn ? '侧栏广告：开（竖屏时填满两侧）' : '侧栏广告：关';
    try {
      frameEl.contentWindow.postMessage({ type: 'moyu:sideads', on: sideOn }, '*');
    } catch {}
  }
  function toggleSide() {
    sideOn = !sideOn;
    localStorage.setItem('moyu.sideads', sideOn ? '1' : '0');
    paintSide();
  }
  $('side').onclick = toggleSide;
  // 快捷键备选：按钮失效时用它判断是"点击没进来"还是"消息没送到"
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && String(e.key).toLowerCase() === 'a') {
      e.preventDefault();
      toggleSide();
    }
  });
  frameEl.addEventListener('load', () => setTimeout(paintSide, 300));
  setTimeout(paintSide, 1200);
  $('close').onclick = () => api.quit();

  let muted = true;
  $('sound').onclick = () => {
    muted = !muted;
    $('sound').textContent = muted ? '🔇' : '🔊';
    const frame = $('frame');
    frame.contentWindow.postMessage({ type: muted ? 'moyu:mute' : 'moyu:unmute' }, '*');
  };

  // 鼠标穿透：只有顶栏和输入栏接收点击，中间画面直接穿透到下层应用
  const BAR = 44, FOOT = 46;
  let interactive = null;
  document.addEventListener('mousemove', (e) => {
    const over = e.clientY <= BAR || e.clientY >= window.innerHeight - FOOT;
    if (over === interactive) return;
    interactive = over;
    api.interactive(over);
  });

  let left = 2 * 3600 + 31 * 60 + 12;
  setInterval(() => {
    left = left > 0 ? left - 1 : 2 * 3600 + 31 * 60 + 12;
    const h = String(Math.floor(left / 3600)).padStart(2, '0');
    const m = String(Math.floor((left % 3600) / 60)).padStart(2, '0');
    const sec = String(left % 60).padStart(2, '0');
    const el = $('clock');
    if (el) el.textContent = h + ':' + m + ':' + sec;
  }, 1000);

  const input = $('msg');
  input.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    $('hint').className = '';
    $('hint').textContent = '发送中…';
    if (typeof api.send !== 'function') {
      $('hint').className = 'err';
      $('hint').textContent = '接口缺失';
      input.value = text;
      return;
    }
    const r = await api.send(text);
    if (r && r.ok) {
      $('hint').textContent = '已发送 ✓';
      setTimeout(() => { $('hint').textContent = ''; }, 1500);
    } else {
      $('hint').className = 'err';
      $('hint').textContent = (r && r.error) || '失败';
      input.value = text;
    }
  });
</script>
</body>
</html>
