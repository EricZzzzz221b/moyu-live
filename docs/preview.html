<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 30% 20%, #1b2030, #0b0d12 70%); }
  body { display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box;
         font: 13px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  .win {
    width: 820px; height: 520px; display: flex; flex-direction: column; overflow: hidden;
    background: #0e0f13; color: #cfd4e0; border-radius: 10px;
    border: 2px solid #ff6a3d; box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .bar { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px;
         background: linear-gradient(90deg,#ff5f3d 0%,#ff8f3d 55%,#ffb03d 100%); color: #fff; flex: 0 0 auto; }
  .tag { font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 3px;
         background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.45); }
  .copy { font-size: 15px; font-weight: 700; letter-spacing: .3px; text-shadow: 0 1px 1px rgba(120,40,0,.35); }
  .grow { flex: 1; }
  .btn { background: rgba(0,0,0,.16); border: 1px solid rgba(255,255,255,.28); color: #fff;
         border-radius: 6px; padding: 2px 6px; font-size: 11px; }
  .btn.on { background: rgba(255,255,255,.28); border-color: #fff; }
  .pct { font-size: 10px; min-width: 30px; text-align: center; opacity: .9; }
  .x { width: 18px; height: 18px; line-height: 16px; text-align: center; border-radius: 4px;
       background: rgba(255,255,255,.9); color: #d9482b; font-weight: 700; font-size: 12px; }

  .stage { position: relative; flex: 1; min-height: 0; display: flex; background: #000; }
  .video {
    flex: 1; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,190,140,.22), transparent 55%),
      linear-gradient(160deg, #241b2e 0%, #131722 45%, #0d1016 100%);
  }
  .video::after {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 46px 46px; opacity: .5;
  }
  .live { position: absolute; left: 14px; top: 12px; display: flex; align-items: center; gap: 6px;
          font-size: 11px; color: #fff; background: rgba(220,60,70,.9); padding: 3px 9px; border-radius: 4px; z-index: 2; }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; display: block; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          color: rgba(255,255,255,.30); font-size: 15px; letter-spacing: 4px; z-index: 1; }

  .promo { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; z-index: 6;
           display: flex; align-items: center; gap: 12px; padding: 0 16px;
           background: linear-gradient(90deg, rgba(255,95,61,.95), rgba(255,150,61,.95) 60%, rgba(255,176,61,.95));
           color: #fff; }
  .p1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
  .p2 { font-size: 12px; opacity: .92; }
  .cta { margin-left: auto; background: #fff; color: #d9482b; border-radius: 15px; padding: 6px 16px;
         font-size: 13px; font-weight: 800; box-shadow: 0 3px 10px rgba(120,40,0,.3); }
  .admark { position: absolute; right: 10px; bottom: 58px; font-size: 10px; color: rgba(255,255,255,.55);
            background: rgba(0,0,0,.35); padding: 1px 5px; border-radius: 3px; z-index: 7; }

  .foot { height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
          background: #1a1d24; border-top: 1px solid rgba(255,255,255,.08); flex: 0 0 auto; }
  .input { flex: 1; background: #0f1116; border: 1px solid rgba(255,255,255,.1); color: #6b7280;
           border-radius: 8px; padding: 7px 10px; font-size: 13px; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar">
      <span class="tag">推广</span>
      <span class="copy">限时特惠 · 新用户专享 0 元购</span>
      <span class="grow"></span>
      <span class="btn">透明−</span><span class="pct">60%</span><span class="btn">透明+</span>
      <span class="btn">置顶</span><span class="btn on">📢</span><span class="btn">🎧</span><span class="btn">🔊</span>
      <span class="x">×</span>
    </div>

    <div class="stage">
      <div class="video">
        <div class="live"><i></i>直播中</div>
        <div class="hint">直 播 画 面</div>
        <div class="admark">广告</div>
        <div class="promo">
          <span class="p1">限时秒杀</span>
          <span class="p2">距结束 <b>02:30:05</b></span>
          <span class="cta">立即抢购</span>
        </div>
      </div>
    </div>

    <div class="foot"><div class="input">说点什么…</div></div>
  </div>
</body>
</html>
